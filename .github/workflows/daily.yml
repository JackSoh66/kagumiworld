name: Daily creative practice

on:
  schedule:
    # 09:17 Asia/Kuala_Lumpur (UTC+8). GitHub may delay scheduled jobs.
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kagumi-daily
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      created: ${{ steps.package.outputs.created }}
      date: ${{ steps.prepare.outputs.date }}
      baseline: ${{ steps.baseline.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Resolve local date and skip duplicates
        id: prepare
        run: node scripts/prepare-daily.mjs
      - name: Capture immutable starting commit
        id: baseline
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Check model credential
        if: steps.prepare.outputs.exists != 'true'
        env:
          DAILY_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$DAILY_API_KEY" ]; then
            echo '::error::Add OPENAI_API_KEY in repository Settings → Secrets and variables → Actions before daily creation can run. Do not put the key in a file or issue.'
            exit 1
          fi
      - name: Install locked dependencies and browser
        if: steps.prepare.outputs.exists != 'true'
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Read current reference sources
        if: steps.prepare.outputs.exists != 'true'
        env:
          KAGUMI_DATE: ${{ steps.prepare.outputs.date }}
        run: npm run daily:research
      - name: Research, decide and build one new experience
        if: steps.prepare.outputs.exists != 'true'
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1
        env:
          KAGUMI_DATE: ${{ steps.prepare.outputs.date }}
          KAGUMI_BASE_SHA: ${{ steps.baseline.outputs.sha }}
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':workspace'
          safety-strategy: drop-sudo
          codex-version: '0.163.0'
          codex-args: '["--search"]'
          prompt-file: .github/prompts/daily.md
          output-file: artifacts/daily-summary.md
      - name: Independently verify scope, build and interactions
        if: steps.prepare.outputs.exists != 'true'
        env:
          KAGUMI_DATE: ${{ steps.prepare.outputs.date }}
          KAGUMI_BASE_SHA: ${{ steps.baseline.outputs.sha }}
        run: |
          git diff --exit-code "$KAGUMI_BASE_SHA" -- scripts .github automation-tests AGENTS.md README.md package.json package-lock.json playwright.config.js vite.config.js src index.html .gitignore .nvmrc
          npm run daily:verify
          npm run build
          npm run test:automation
          npm test
      - name: Package verified changes
        if: steps.prepare.outputs.exists != 'true'
        id: package
        run: |
          mkdir -p artifacts
          git add -- data/experiments.json public/experiments public/previews research tests
          git diff --cached --binary > artifacts/daily.patch
          test -s artifacts/daily.patch
          echo 'created=true' >> "$GITHUB_OUTPUT"
      - name: Retain verified patch
        if: steps.package.outputs.created == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daily-patch
          path: artifacts/daily.patch
          if-no-files-found: error
          retention-days: 7
      - name: Retain screenshots, report and creation notes
        if: always() && steps.prepare.outputs.exists != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daily-evidence
          path: |
            playwright-report/
            test-results/
            artifacts/daily-summary.md
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs: create
    if: needs.create.outputs.created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: daily-patch
          path: artifacts
      - name: Reject stale work and recheck scope before committing
        env:
          KAGUMI_BASE_SHA: ${{ needs.create.outputs.baseline }}
          KAGUMI_DATE: ${{ needs.create.outputs.date }}
        run: |
          test "$(git rev-parse HEAD)" = "$KAGUMI_BASE_SHA"
          git apply --index artifacts/daily.patch
          npm run daily:verify
          git config user.name 'kagumi-daily[bot]'
          git config user.email 'kagumi-daily[bot]@users.noreply.github.com'
          git commit -m "feat: daily web experiment $KAGUMI_DATE"
          git push origin HEAD:main
          echo "Created and pushed one verified experiment for $KAGUMI_DATE." >> "$GITHUB_STEP_SUMMARY"
